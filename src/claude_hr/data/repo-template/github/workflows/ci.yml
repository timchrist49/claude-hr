name: ci

on:
  push:
    branches: ["{{default_branch}}"]
  pull_request:

# Least privilege: jobs get a read-only token unless a job asks for more.
permissions:
  contents: read

# A new push to a pull request cancels the run it makes obsolete; pushes to the default branch always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are referenced by tag: pin to a commit SHA (Dependabot keeps them updated).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
{{steps_block}}
