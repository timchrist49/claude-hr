# Declarative plugin plan. `claude-hr-ctl plugins sync` makes the machine match the chosen profile.
# Rules: a plugin counts as installed if the SAME NAME is installed from ANY marketplace (no duplicates);
# plugins not listed here are never removed unless you pass --prune.
# Third-party plugins come only from Anthropic's SHA-pinned catalog or from this repo's own marketplace.

[marketplaces.claude-hr]
source = "@repo"                                   # this repository (local checkout) -> `hr-core`

[marketplaces.claude-plugins-official]
source = "anthropics/claude-plugins-official"      # every external entry in this catalog is pinned to a 40-char SHA

[marketplaces.headroom-marketplace]
source = "headroomlabs-ai/headroom"
requires = "headroom.install_plugins"

# ---- profiles -------------------------------------------------------------------------------
[profiles.minimal]
description = "Token-lean: only claude-hr's own plugin (3 read-only subagents, 7 skills of which 6 are manual-only, 1 guard hook)."
plugins = ["hr-core@claude-hr"]

[profiles.standard]
description = "Recommended default: lean. Adds the end-of-turn gates (format + verify), security-guidance, CLAUDE.md upkeep, library docs and the savings band."
extends = "minimal"
plugins = [
  "hr-gates@claude-hr",                             # one Stop hook: format changed files, run the repo's trusted fast checks, audit trail (no context cost)
  "claude-md-management@claude-plugins-official",   # audit/improve CLAUDE.md (manual use)
  "security-guidance@claude-plugins-official",      # edit-time regex warnings + commit-time review (per-turn Opus review off by default, see security.stop_review)
  "context7@claude-plugins-official",               # current library docs (MCP, deferred by tool search)
  "headroom-snip@headroom-marketplace",             # live token-savings band + status line
]

[profiles.process]
description = "Standard + Superpowers' process skills (TDD, plans, review) and feature-dev. Costs roughly 1.5-2k extra always-on tokens (its SessionStart hook injects a whole skill) and overlaps hr-plan / hr-done / bundled /code-review: only if you want that flow."
extends = "standard"
plugins = [
  "superpowers@claude-plugins-official",            # process skills: TDD, debugging, plans, worktrees
  "feature-dev@claude-plugins-official",            # guided feature workflow + 3 agents
]

[profiles.audit]
description = "Standard + the official claude-security plugin for deep, on-demand security scans before a release (heavy by design: run it deliberately)."
extends = "standard"
plugins = [
  "claude-security@claude-plugins-official",
]

[profiles.full]
description = "Everything above except Ponytail, plus maintainer tooling."
extends = "process"
plugins = [
  "claude-security@claude-plugins-official",
  "skill-creator@claude-plugins-official",
]

[profiles.lean-output]
description = "Standard + Ponytail (Headroom's recommended companion for terser output). It changes how the model writes code - evaluate before rolling out."
extends = "standard"
plugins = [
  "ponytail@claude-hr",   # third-party, pinned to a reviewed commit in this repo's marketplace.json
]

# Opt-in per project (NOT installed at user scope: large always-on cost outside the matching projects).
# `claude-hr-ctl plugins suggest` looks at the current directory and tells you when to enable these.
[project_scoped]
"vercel@claude-plugins-official" = { markers = ["vercel.json", ".vercel", "next.config.js", "next.config.mjs", "next.config.ts"], why = "35 skills + 200+ MCP tools (~4k tokens always-on, far more without tool search)" }
"frontend-design@claude-plugins-official" = { markers = ["tailwind.config.js", "tailwind.config.ts", "components.json"], why = "UI design guidance" }

# Known to overlap with something Claude Code already bundles, or reviewed and rejected; flagged by `plugins audit`.
[redundant]
"code-review@claude-plugins-official" = "Claude Code bundles /code-review; two copies compete for the same prompts."
"code-simplifier@claude-plugins-official" = "Claude Code bundles /simplify (4 parallel agents); the plugin adds listing tokens for the same job."
"ecc@ecc" = "Everything Claude Code (affaan-m/ECC) overlaps hr-core, hr-gates and the bundled /code-review and /security-review, cannot be subset (293 skills, 68 agents, 94 commands, 24 hook entries that start 2-3 node processes each even when off) and adds about 13.6k always-on tokens (measured) for no gain seen in tests. Reviewed, tested and not adopted: docs/ADDONS.md."
"everything-claude-code@everything-claude-code" = "Everything Claude Code (affaan-m/ECC) overlaps hr-core, hr-gates and the bundled /code-review and /security-review, cannot be subset (293 skills, 68 agents, 94 commands, 24 hook entries that start 2-3 node processes each even when off) and adds about 13.6k always-on tokens (measured) for no gain seen in tests. Reviewed, tested and not adopted: docs/ADDONS.md."
