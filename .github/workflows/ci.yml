name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches upstream (Claude Code / Headroom / uv) drift

# Least privilege: nothing here writes to the repository, so the token is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"   # tests/workflow_harness.js validates the saved Workflow scripts
      - name: Format (the repo formats itself with ruff)
        run: uv run --python ${{ matrix.python }} --with ruff ruff format --check .
      - name: Lint
        run: uv run --python ${{ matrix.python }} --with ruff ruff check src tests
      - name: Unit tests
        run: uv run --python ${{ matrix.python }} --with pytest pytest -q -p no:cacheprovider tests
      - name: Plugin + marketplace manifests validate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate plugins/hr-core
          claude plugin validate plugins/hr-gates
          claude plugin validate .

  linux-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (the Headroom install pulls CUDA PyTorch: about 7 GB on disk)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Build bare-VM image
        run: docker build -f tests/docker/Dockerfile.linux -t claude-hr-linux-test tests/docker
      - name: Fresh install + behaviour tests
        run: docker run --rm -v "$PWD:/src:ro" -e SRC_DIR=/src claude-hr-linux-test bash /src/tests/docker/run-linux-e2e.sh
